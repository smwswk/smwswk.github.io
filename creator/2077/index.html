      <p class="lead">一组关于边缘街区、临时结构和低饱和未来感的色彩观察。</p>
      <p>这些图像来自城市秩序的缝隙：围挡、轮胎、墙面、绿化、车辆、市场灯光和生活痕迹。它们不像科幻片里的未来，更像当下已经提前长出的未来。</p>
