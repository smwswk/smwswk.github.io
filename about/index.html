<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="个人 AI 工作台的公开边界与隐私说明。">
  <title>公开边界 · 个人 AI 工作台</title>
  <style>
    :root { color-scheme: dark; --bg:#08111d; --card:#101d2d; --text:#f4f7fb; --sub:#a8b5c5; --accent:#76b7ff; --line:#26384d; }
    * { box-sizing:border-box; }
    body { margin:0; padding:32px 18px; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; line-height:1.75; }
    main { max-width:760px; margin:0 auto; }
    a { color:var(--accent); }
    .back { display:inline-block; margin-bottom:24px; text-decoration:none; }
    .card { padding:28px; border:1px solid var(--line); border-radius:18px; background:var(--card); }
    h1 { margin:0 0 12px; font-size:clamp(30px,7vw,48px); line-height:1.15; }
    h2 { margin:28px 0 8px; font-size:20px; }
    p, li { color:var(--sub); }
    strong { color:var(--text); }
    ul { padding-left:20px; }
  </style>
</head>
<body>
  <main>
    <a class="back" href="/">← 返回工作台</a>
    <section class="card">
      <h1>公开边界</h1>
      <p>这是一个自用 AI 工作系统的公开索引，不是个人简历、社交账号导航或服务接单页。</p>
      <h2>公开什么</h2>
      <ul>
        <li>已经脱敏、可独立复用的工具和工作流；</li>
        <li>不依赖真实身份的交互与视觉实验；</li>
        <li>播客项目的公开数据页面。</li>
      </ul>
      <h2>不公开什么</h2>
      <ul>
        <li>真实姓名、单位、所在地、履历和个人社交账号；</li>
        <li>微信、电话、邮箱、报价和个人服务入口；</li>
        <li>真实工作数据、账号配置、内部地址、精确位置和生产环境。</li>
      </ul>
      <h2>服务边界</h2>
      <p><strong>本站不承接个人 AI 咨询、代部署或定制开发。</strong>公开页面仅用于记录方法、工具与实验。</p>
      <p><a href="/podcast/">查看保留的播客数据页</a></p>
    </section>
  </main>
</body>
</html>
