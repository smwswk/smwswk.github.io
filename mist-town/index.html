    100% { transform: translateX(5%) scale(0.95); }
  }

  /* Grain texture */

    position: fixed;

  const hours = Math.floor(diff / (1000 * 60 * 60));
  const days = Math.floor(hours / 24);

    const remaining = hours % 24;
    if (remaining > 0) return `距离上次来访已经过去了 ${days} 天 ${remaining} 小时`;
    return `距离上次来访已经过去了 ${days} 天`;
  }
  if (hours > 0) return `距离上次来访已经过去了 ${hours} 小时`;
  const mins = Math.floor(diff / (1000 * 60));
  if (mins > 0) return `距离上次来访已经过去了 ${mins} 分钟`;
  return "你刚刚才来过";
}

function render() {
  const s = STATE;

  // Elapsed time
  document.getElementById('elapsed').innerHTML =
    `<strong>${formatElapsed(s.meta.last_visited)}</strong>`;
  document.getElementById('visitCount').textContent =
    `第 ${s.meta.visit_count} 次来访`;

  // World state
  document.getElementById('worldTime').textContent = s.world.time_of_day;
  document.getElementById('worldWeather').textContent = s.world.weather;
  document.getElementById('worldMood').textContent = s.world.mood;

  // Events
  const eventsEl = document.getElementById('events');
  eventsEl.innerHTML = s.events.map(e => {
    const time = new Date(e.time).toLocaleString('zh-CN', {
      month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
    });
    const actors = e.involved.map(id =>
      `<span class="actor-tag">${ACTOR_NAMES[id] || id}</span>`
    ).join('');
    return `
      <div class="event-card">
        <div class="time">${time}</div>
        <div class="text">${e.description}</div>
        ${actors ? `<div class="actors">${actors}</div>` : ''}
      </div>
    `;
  }).join('');

  // Characters
  const charEl = document.getElementById('characters');
  charEl.innerHTML = Object.values(s.characters).map(c => `
    <div class="character-card">
      <div class="name">${c.name}</div>
      <div class="location">📍 ${c.location}</div>
      <div class="mood">${c.mood}</div>
      <div class="activity">${c.activity}</div>
    </div>
  `).join('');

  // Hooks
  const hooksEl = document.getElementById('hooks');
  hooksEl.innerHTML = s.plot_hooks.map(h => `<li>${h}</li>`).join('');
}

function growWorld() {
  const btn = document.getElementById('growBtn');
  btn.disabled = true;
  btn.textContent = "雾正在变浓...";

  // In a real version, this would call an AI to generate new events
  // For now, we simulate the passage of time
  setTimeout(() => {
    STATE.meta.last_visited = new Date().toISOString();
    STATE.meta.visit_count++;

    // Simulate a new event based on time passage
    const now = new Date();
    const timeStr = now.toISOString().slice(0, 16);

    // Simple growth logic (placeholder for AI generation)
    const newEvents = [
      {
        "time": timeStr,
        "type": "world_state",
        "description": "雾又浓了一些。你注意到酒馆门口的灯笼在轻微晃动，但没有风。",
        "involved": []
      }
    ];

    STATE.events.unshift(...newEvents);
    render();

    btn.disabled = false;
    btn.textContent = "让世界继续生长";
  }, 1500);
}

// Reader notes
const NOTES_KEY = 'mist_town_notes';

function loadNotes() {
  try {
    return JSON.parse(localStorage.getItem(NOTES_KEY) || '[]');
  } catch {
    return [];
  }
}

function saveNotes(notes) {
  localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
}

function renderNotes() {
  const notes = loadNotes();
  const container = document.getElementById('notesList');
  if (notes.length === 0) {
    container.innerHTML = '<div class="note-empty">还没有笔记。写下你的第一个观察...</div>';
    return;
  }
  container.innerHTML = notes.map((note, idx) => `
    <div class="note-item">
      <div class="note-delete" onclick="deleteNote(${idx})">删除</div>
      <div class="note-time">${new Date(note.time).toLocaleString('zh-CN')}</div>
      ${escapeHtml(note.text)}
    </div>
  `).join('');
}

function addNote() {
  const input = document.getElementById('noteInput');
  const text = input.value.trim();
  if (!text) return;

  const notes = loadNotes();
  notes.unshift({
    time: new Date().toISOString(),
    text: text
  });
  saveNotes(notes);
  input.value = '';
  renderNotes();
}

function deleteNote(idx) {
  const notes = loadNotes();
  notes.splice(idx, 1);
  saveNotes(notes);
  renderNotes();
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// Init notes
renderNotes();

render();
</script>
