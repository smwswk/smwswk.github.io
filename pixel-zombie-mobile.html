  <script>
// core.js
// ============================================================
// core.js — 像素俯视角射击游戏「核心框架」
// 全局接口: canvas, ctx, game, INPUT, camera, map
// ============================================================

// ==================== 工具函数 ====================

function rectIntersect(r1, r2) {
  return (
    r1.x < r2.x + r2.w &&
    r1.x + r1.w > r2.x &&
    r1.y < r2.y + r2.h &&
    r1.y + r1.h > r2.y
  );
}

function circleRectCollision(cx, cy, cr, rx, ry, rw, rh) {
  const closestX = Math.max(rx, Math.min(cx, rx + rw));
  const closestY = Math.max(ry, Math.min(cy, ry + rh));
  const dx = cx - closestX;
  const dy = cy - closestY;
  return (dx * dx + dy * dy) < (cr * cr);
}

function dist(x1, y1, x2, y2) {
  const dx = x2 - x1;
  const dy = y2 - y1;
  return Math.sqrt(dx * dx + dy * dy);
}

function angleTo(x1, y1, x2, y2) {
  return Math.atan2(y2 - y1, x2 - x1);
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function rand(min, max) {
  return Math.random() * (max - min) + min;
}

function randInt(min, max) {
  return Math.floor(rand(min, max));
}

function randPick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

// ==================== Input 类 ====================

class Input {
  constructor(canvas) {
    this.canvas = canvas;
    this.keys = {};
    this.mouseX = 0;
    this.mouseY = 0;
    this.mouseWorldX = 0;
    this.mouseWorldY = 0;
    this.mouseDown = false;
    this.mouseJustPressed = false;
    this.touchMoveId = null;
    this.touchAimId = null;
    this.joystick = {
      active: false,
      baseX: 0,
      baseY: 0,
      knobX: 0,
      knobY: 0,
      dx: 0,
      dy: 0,
      radius: 58,
    };
    this.mobileActions = new Set();

    this._boundKeyDown = this._onKeyDown.bind(this);
    this._boundKeyUp = this._onKeyUp.bind(this);
    this._boundMouseMove = this._onMouseMove.bind(this);
    this._boundMouseDown = this._onMouseDown.bind(this);
    this._boundMouseUp = this._onMouseUp.bind(this);
    this._boundContextMenu = this._onContextMenu.bind(this);
    this._boundTouchStart = this._onTouchStart.bind(this);
    this._boundTouchMove = this._onTouchMove.bind(this);
    this._boundTouchEnd = this._onTouchEnd.bind(this);

    window.addEventListener('keydown', this._boundKeyDown);
    window.addEventListener('keyup', this._boundKeyUp);
    canvas.addEventListener('mousemove', this._boundMouseMove);
    canvas.addEventListener('mousedown', this._boundMouseDown);
    canvas.addEventListener('mouseup', this._boundMouseUp);
    canvas.addEventListener('contextmenu', this._boundContextMenu);
    canvas.addEventListener('touchstart', this._boundTouchStart, { passive: false });
    canvas.addEventListener('touchmove', this._boundTouchMove, { passive: false });
    canvas.addEventListener('touchend', this._boundTouchEnd, { passive: false });
    canvas.addEventListener('touchcancel', this._boundTouchEnd, { passive: false });
  }

  hasTouchInput() {
    const nav = typeof navigator !== 'undefined' ? navigator : (typeof window !== 'undefined' ? window.navigator : null);
    return !!(nav && nav.maxTouchPoints > 0);
  }

  hasCoarsePointer() {
    return !!(
      typeof window !== 'undefined' &&
      typeof window.matchMedia === 'function' &&
      window.matchMedia('(pointer: coarse)').matches
    );
  }

  prefersTouchControls() {
    return this.hasTouchInput() || this.hasCoarsePointer();
  }

  isMobileLayout() {
    return this.prefersTouchControls();
  }

  isCompactLandscape() {
    return this.isMobileLayout() && this.canvas.width > this.canvas.height && this.canvas.height <= 430;
  }

  getJoystickRadius() {
    if (this.isCompactLandscape()) return Math.max(40, Math.min(48, this.canvas.height * 0.12));
    return Math.max(48, Math.min(58, Math.min(this.canvas.width, this.canvas.height) * 0.15));
  }

  getJoystickRestPosition() {
    const radius = this.getJoystickRadius();
    return {
      x: 20 + radius,
      y: this.canvas.height - 28 - radius,
    };
  }

  hasOpenTouchUI() {
    if (typeof game === 'undefined' || !game) return false;
    return !!(
      (game.shopSystem && game.shopSystem.open) ||
      (game.upgradeSystem && game.upgradeSystem.open) ||
      (game.equipmentUI && game.equipmentUI.open) ||
      (game.relicSystem && game.relicSystem.showChoice)
    );
  }

  _onKeyDown(e) {
    this.keys[e.code] = true;
    // Prevent default for game keys to avoid page scrolling
    const gameKeys = [
      'KeyW', 'KeyA', 'KeyS', 'KeyD',
      'Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5',
      'Digit6', 'Digit7', 'Digit8', 'Digit9',
      'KeyB', 'KeyU', 'KeyR', 'KeyE', 'KeyQ', 'KeyT', 'KeyY', 'KeyF', 'KeyC', 'KeyV',
      'ShiftLeft', 'ShiftRight', 'Space', 'Escape'
    ];
    if (gameKeys.includes(e.code)) {
      e.preventDefault();
    }
  }

  _onKeyUp(e) {
    this.keys[e.code] = false;
  }

  _onMouseMove(e) {
    const rect = this.canvas.getBoundingClientRect();
    this.mouseX = e.clientX - rect.left;
    this.mouseY = e.clientY - rect.top;
  }

  _onMouseDown(e) {
    if (e.button === 0) {
      this.mouseDown = true;
      this.mouseJustPressed = true;
    }
  }

  _onMouseUp(e) {
    if (e.button === 0) {
      this.mouseDown = false;
    }
  }

  _onContextMenu(e) {
    e.preventDefault();
  }

  _eventPoint(touch) {
    const rect = this.canvas.getBoundingClientRect();
    return {
      id: touch.identifier,
      x: touch.clientX - rect.left,
      y: touch.clientY - rect.top,
    };
  }

  getMobileButtons() {
    const W = this.canvas.width;
    const H = this.canvas.height;
    const landscape = this.isCompactLandscape();
    const size = landscape
      ? Math.max(40, Math.min(46, Math.min(W, H) * 0.12))
      : Math.max(44, Math.min(58, Math.min(W, H) * 0.12));
    const gap = landscape ? 8 : 10;
    const right = W - (landscape ? 12 : 16) - size;
    const bottom = H - (landscape ? 10 : 18) - size;
    const shopY = landscape ? 12 : Math.max(64, H * 0.08);
    return [
      { id: 'shop', icon: 'cart', x: right, y: shopY, w: size, h: size },
      { id: 'dash', icon: 'dash', x: right, y: bottom - (size + gap), w: size, h: size },
      { id: 'interact', icon: 'interact', x: right - (size + gap), y: bottom, w: size, h: size },
      { id: 'nextWeapon', icon: 'swap', x: right, y: bottom, w: size, h: size },
      ...this.getMobileSkillButtons(),
    ];
  }

  getMobileSkillButtons() {
    const skillIds = this._getMobileSkillIds();
    if (skillIds.length === 0) return [];

    const W = this.canvas.width;
    const H = this.canvas.height;
    const landscape = this.isCompactLandscape();
    const gap = landscape ? 6 : 8;

    if (landscape) {
      const size = Math.max(32, Math.min(38, H * 0.105));
      const totalW = skillIds.length * size + (skillIds.length - 1) * gap;
      const minX = Math.max(132, this.getJoystickRestPosition().x + this.getJoystickRadius() + 18);
      const maxX = Math.max(minX, W - totalW - 160);
      const x = Math.max(minX, Math.min(maxX, (W - totalW) / 2));
      const y = H - size - 10;
      return skillIds.map((id, i) => ({
        id: `skill:${id}`,
        skillId: id,
        icon: this._skillIcon(id),
        x: x + i * (size + gap),
        y,
        w: size,
        h: size,
      }));
    }

    const size = Math.max(38, Math.min(46, W * 0.12));
    const cols = 2;
    const x = W - 16 - cols * size - (cols - 1) * gap;
    const y = Math.max(104, Math.min(H * 0.18, H - 340));
    return skillIds.map((id, i) => {
      const col = i % cols;
      const row = Math.floor(i / cols);
      return {
        id: `skill:${id}`,
        skillId: id,
        icon: this._skillIcon(id),
        x: x + col * (size + gap),
        y: y + row * (size + gap),
        w: size,
        h: size,
      };
    });
  }

  _getMobileSkillIds() {
    if (typeof game === 'undefined' || !game || !game.heroSkillSystem) return [];
    const skills = typeof HERO_SKILL_DATA !== 'undefined' ? HERO_SKILL_DATA : game.heroSkillSystem.skills;
    return Object.keys(skills).filter(id => game.heroSkillSystem.isUnlocked(id));
  }

  _skillIcon(id) {
    const icons = {
      shockwave: 'shockwave',
      phaseDash: 'phase',
      medField: 'heal',
      stasisGrenade: 'stasis',
      orbitalStrike: 'orbital',
      nanoSwarm: 'nano',
    };
    return icons[id] || 'pulse';
  }

  _hitMobileButton(x, y) {
    if (!this.isMobileLayout()) return null;
    return this.getMobileButtons().find(btn => (
      x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h
    )) || null;
  }

  consumeAction(id) {
    if (!this.mobileActions.has(id)) return false;
    this.mobileActions.delete(id);
    return true;
  }

  _onTouchStart(e) {
    if (e.preventDefault) e.preventDefault();
    for (const touch of Array.from(e.changedTouches || [])) {
      const p = this._eventPoint(touch);
      if (this.hasOpenTouchUI()) continue;

      const button = this._hitMobileButton(p.x, p.y);
      if (button) {
        this.mobileActions.add(button.id);
        continue;
      }

      if (p.x < this.canvas.width * 0.45 && this.touchMoveId === null) {
        this.touchMoveId = p.id;
        this.joystick.radius = this.getJoystickRadius();
        this.joystick.active = true;
        this.joystick.baseX = p.x;
        this.joystick.baseY = p.y;
        this.joystick.knobX = p.x;
        this.joystick.knobY = p.y;
        this.joystick.dx = 0;
        this.joystick.dy = 0;
      } else if (this.touchAimId === null) {
        this.touchAimId = p.id;
        this.mouseX = p.x;
        this.mouseY = p.y;
        this.mouseDown = true;
        this.mouseJustPressed = true;
      }
    }
  }

  _onTouchMove(e) {
    if (e.preventDefault) e.preventDefault();
    for (const touch of Array.from(e.changedTouches || [])) {
      const p = this._eventPoint(touch);
      if (this.hasOpenTouchUI()) continue;

      if (p.id === this.touchMoveId) {
        const rawDx = p.x - this.joystick.baseX;
        const rawDy = p.y - this.joystick.baseY;
        const len = Math.sqrt(rawDx * rawDx + rawDy * rawDy);
        const limit = this.joystick.radius;
        const clamped = len > limit ? limit / len : 1;
        this.joystick.knobX = this.joystick.baseX + rawDx * clamped;
        this.joystick.knobY = this.joystick.baseY + rawDy * clamped;
        this.joystick.dx = len > 6 ? (rawDx * clamped) / limit : 0;
        this.joystick.dy = len > 6 ? (rawDy * clamped) / limit : 0;
      } else if (p.id === this.touchAimId) {
        this.mouseX = p.x;
        this.mouseY = p.y;
        this.mouseDown = true;
      }
    }
  }

  _onTouchEnd(e) {
    if (e.preventDefault) e.preventDefault();
    for (const touch of Array.from(e.changedTouches || [])) {
      const p = this._eventPoint(touch);
      if (p.id === this.touchMoveId) {
        this.touchMoveId = null;
        this.joystick.active = false;
        this.joystick.dx = 0;
        this.joystick.dy = 0;
        this.keys.KeyW = false;
        this.keys.KeyA = false;
        this.keys.KeyS = false;
        this.keys.KeyD = false;
      }
      if (p.id === this.touchAimId) {
        this.touchAimId = null;
        this.mouseDown = false;
      }
    }
  }

  update(camera) {
    if (this.isMobileLayout()) {
      const deadzone = 0.22;
      this.keys.KeyA = this.joystick.active && this.joystick.dx < -deadzone;
      this.keys.KeyD = this.joystick.active && this.joystick.dx > deadzone;
      this.keys.KeyW = this.joystick.active && this.joystick.dy < -deadzone;
      this.keys.KeyS = this.joystick.active && this.joystick.dy > deadzone;
    }
    // Convert screen mouse coordinates to world coordinates
    if (camera) {
      this.mouseWorldX = this.mouseX + camera.x;
      this.mouseWorldY = this.mouseY + camera.y;
    } else {
      this.mouseWorldX = this.mouseX;
      this.mouseWorldY = this.mouseY;
    }
  }

  // Call this at the end of each frame to reset one-frame flags
  endFrame() {
    this.mouseJustPressed = false;
  }

  drawMobileControls(ctx) {
    if (!this.isMobileLayout()) return;
    this.joystick.radius = this.getJoystickRadius();
    ctx.save();
    ctx.lineWidth = 2;
    if (this.joystick.active) {
      ctx.globalAlpha = 0.45;
      ctx.fillStyle = '#111827';
      ctx.strokeStyle = '#8cf';
      ctx.beginPath();
      ctx.arc(this.joystick.baseX, this.joystick.baseY, this.joystick.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.globalAlpha = 0.75;
      ctx.fillStyle = '#66aaff';
      ctx.beginPath();
      ctx.arc(this.joystick.knobX, this.joystick.knobY, Math.max(18, this.joystick.radius * 0.42), 0, Math.PI * 2);
      ctx.fill();
    } else {
      const { x, y } = this.getJoystickRestPosition();
      ctx.globalAlpha = 0.18;
      ctx.strokeStyle = '#8cf';
      ctx.beginPath();
      ctx.arc(x, y, this.joystick.radius, 0, Math.PI * 2);
      ctx.stroke();
    }

    for (const btn of this.getMobileButtons()) {
      this._drawMobileButton(ctx, btn);
    }
    ctx.restore();
    ctx.textBaseline = 'alphabetic';
  }

  _mobileButtonColor(icon) {
    const colors = {
      cart: '#d6a73a',
      pulse: '#33b6ff',
      dash: '#a78bfa',
      interact: '#4ade80',
      swap: '#60a5fa',
      shockwave: '#33b6ff',
      phase: '#a78bfa',
      heal: '#4ade80',
      stasis: '#b084ff',
      orbital: '#ffcc66',
      nano: '#66ffcc',
    };
    return colors[icon] || '#7aa7ff';
  }

  _drawMobileButton(ctx, btn) {
    const accent = this._mobileButtonColor(btn.icon);
    ctx.save();
    ctx.globalAlpha = 0.64;
    ctx.fillStyle = 'rgba(10, 15, 24, 0.78)';
    ctx.fillRect(btn.x, btn.y, btn.w, btn.h);
    ctx.strokeStyle = accent;
    ctx.lineWidth = 2;
    ctx.strokeRect(btn.x, btn.y, btn.w, btn.h);

    if (btn.skillId && typeof game !== 'undefined' && game.heroSkillSystem) {
      const cooldown = game.heroSkillSystem.cooldowns[btn.skillId] || 0;
      const skill = game.heroSkillSystem.skills[btn.skillId];
      if (cooldown > 0 && skill) {
        const ratio = Math.max(0, Math.min(1, cooldown / skill.cooldown));
        ctx.fillStyle = 'rgba(0, 0, 0, 0.62)';
        ctx.fillRect(btn.x, btn.y, btn.w, btn.h * ratio);
      }
    }

    ctx.globalAlpha = 0.96;
    ctx.translate(btn.x + btn.w / 2, btn.y + btn.h / 2);
    const scale = btn.w / 48;
    ctx.scale(scale, scale);
    ctx.strokeStyle = '#fff';
    ctx.fillStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    this._drawMobileIcon(ctx, btn.icon);
    ctx.restore();
  }

  _drawMobileIcon(ctx, icon) {
    if (icon === 'cart') {
      ctx.beginPath();
      ctx.moveTo(-17, -12);
      ctx.lineTo(-11, -12);
      ctx.lineTo(-7, 6);
      ctx.lineTo(12, 6);
      ctx.lineTo(16, -5);
      ctx.lineTo(-8, -5);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(-4, 13, 3, 0, Math.PI * 2);
      ctx.arc(10, 13, 3, 0, Math.PI * 2);
      ctx.fill();
      return;
    }

    if (icon === 'pulse') {
      ctx.beginPath();
      ctx.arc(0, 0, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(0, 0, 13, Math.PI * 0.08, Math.PI * 1.92);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 0, 20, Math.PI * 0.18, Math.PI * 1.82);
      ctx.stroke();
      return;
    }

    if (icon === 'shockwave') {
      ctx.beginPath();
      ctx.arc(0, 0, 4, 0, Math.PI * 2);
      ctx.fill();
      for (const r of [12, 20]) {
        ctx.beginPath();
        ctx.arc(0, 0, r, Math.PI * 0.1, Math.PI * 1.9);
        ctx.stroke();
      }
      return;
    }

    if (icon === 'dash') {
      ctx.beginPath();
      ctx.moveTo(-3, -20);
      ctx.lineTo(-14, 1);
      ctx.lineTo(-3, 1);
      ctx.lineTo(-8, 20);
      ctx.lineTo(14, -5);
      ctx.lineTo(2, -5);
      ctx.closePath();
      ctx.fill();
      return;
    }

    if (icon === 'phase') {
      ctx.beginPath();
      ctx.moveTo(-18, 8);
      ctx.lineTo(2, -16);
      ctx.lineTo(0, -2);
      ctx.lineTo(18, -8);
      ctx.lineTo(-2, 16);
      ctx.lineTo(0, 2);
      ctx.closePath();
      ctx.fill();
      return;
    }

    if (icon === 'heal') {
      ctx.fillRect(-5, -18, 10, 36);
      ctx.fillRect(-18, -5, 36, 10);
      return;
    }

    if (icon === 'stasis') {
      ctx.beginPath();
      ctx.arc(0, 0, 17, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, -17);
      ctx.lineTo(0, 17);
      ctx.moveTo(-17, 0);
      ctx.lineTo(17, 0);
      ctx.stroke();
      return;
    }

    if (icon === 'orbital') {
      ctx.beginPath();
      ctx.ellipse(0, 0, 20, 8, -0.55, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 0, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(11, -18);
      ctx.lineTo(5, -4);
      ctx.stroke();
      return;
    }

    if (icon === 'nano') {
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * 13, Math.sin(a) * 13, 3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(0, 0, 5, 0, Math.PI * 2);
      ctx.stroke();
      return;
    }

    if (icon === 'interact') {
      ctx.beginPath();
      ctx.rect(-16, -18, 19, 36);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-6, 0);
      ctx.lineTo(17, 0);
      ctx.moveTo(9, -8);
      ctx.lineTo(17, 0);
      ctx.lineTo(9, 8);
      ctx.stroke();
      return;
    }

    if (icon === 'swap') {
      ctx.beginPath();
      ctx.moveTo(-16, -6);
      ctx.lineTo(8, -6);
      ctx.lineTo(2, -12);
      ctx.moveTo(8, -6);
      ctx.lineTo(2, 0);
      ctx.moveTo(16, 6);
      ctx.lineTo(-8, 6);
      ctx.lineTo(-2, 12);
      ctx.moveTo(-8, 6);
      ctx.lineTo(-2, 0);
      ctx.stroke();
    }
  }

  destroy() {
    window.removeEventListener('keydown', this._boundKeyDown);
    window.removeEventListener('keyup', this._boundKeyUp);
    this.canvas.removeEventListener('mousemove', this._boundMouseMove);
    this.canvas.removeEventListener('mousedown', this._boundMouseDown);
    this.canvas.removeEventListener('mouseup', this._boundMouseUp);
    this.canvas.removeEventListener('contextmenu', this._boundContextMenu);
    this.canvas.removeEventListener('touchstart', this._boundTouchStart);
    this.canvas.removeEventListener('touchmove', this._boundTouchMove);
    this.canvas.removeEventListener('touchend', this._boundTouchEnd);
    this.canvas.removeEventListener('touchcancel', this._boundTouchEnd);
  }
}

// ==================== Camera 类 ====================

class Camera {
  constructor(w, h) {
    this.x = 0;
    this.y = 0;
    this.w = w;
    this.h = h;
    this.smoothSpeed = 0.12;
  }

  follow(target, mapWidth, mapHeight) {
    // Target camera position (centered on target)
    const targetX = target.x - this.w / 2;
    const targetY = target.y - this.h / 2;

    // Smooth interpolation
    this.x = lerp(this.x, targetX, this.smoothSpeed);
    this.y = lerp(this.y, targetY, this.smoothSpeed);

    // Clamp to map boundaries
    if (mapWidth !== undefined && mapHeight !== undefined) {
      this.x = Math.max(0, Math.min(this.x, mapWidth - this.w));
      this.y = Math.max(0, Math.min(this.y, mapHeight - this.h));
    }
  }
}

// 地图主题配置
const MAP_THEMES = {
  grass: {

    wallBody: '#5a4a3a',
    wallBorder: '#3a2a1a',
    wallRoof: '#6a5a4a',
    gridColor: '#3d4f30',
    outOfBounds: '#3d4f2a',
    buildingCount: [10, 18],
  },
  desert: {
    groundColors: ['#c4a35a', '#b8934a', '#d4b36a'],
    wallBody: '#8a7a5a',
    wallBorder: '#5a4a2a',
    wallRoof: '#9a8a6a',
    gridColor: '#b8934a',
    outOfBounds: '#c4a35a',
    buildingCount: [6, 12],
  },

    wallRoof: '#4a4a4a',
    gridColor: '#4a4a4a',
    outOfBounds: '#5a5a5a',
    buildingCount: [15, 25],
  },
};

class Map {
  constructor(width, height, tileSize) {
    this.width = width;
    this.height = height;
    this.tileSize = tileSize;
    this.walls = [];      // Array of {x, y, w, h} rectangles (buildings/obstacles)
    this.ground = [];     // 2D grid for ground type info
    this.borderWidth = tileSize;
    this.theme = 'grass';
    this.themeConfig = MAP_THEMES.grass;
  }

  setTheme(themeName) {
    this.theme = themeName;
    this.themeConfig = MAP_THEMES[themeName] || MAP_THEMES.grass;
  }

  generate(themeName) {
    if (themeName) this.setTheme(themeName);
    const cfg = this.themeConfig;
    this.walls = [];
    this.ground = [];

    const cols = Math.ceil(this.width / this.tileSize);
    const rows = Math.ceil(this.height / this.tileSize);

    // Initialize ground grid
    for (let y = 0; y < rows; y++) {
      const row = [];
      for (let x = 0; x < cols; x++) {
        // Random ground variation for visual interest
        row.push(Math.random() < 0.05 ? 1 : (Math.random() < 0.02 ? 2 : 0));
      }
      this.ground.push(row);
    }

    // Create border walls
    const b = this.borderWidth;
    // Top border
    this.walls.push({ x: 0, y: 0, w: this.width, h: b });
    // Bottom border
    this.walls.push({ x: 0, y: this.height - b, w: this.width, h: b });
    // Left border
    this.walls.push({ x: 0, y: 0, w: b, h: this.height });
    // Right border
    this.walls.push({ x: this.width - b, y: 0, w: b, h: this.height });

    // Generate random buildings as cover/obstacles
    const [minBuildings, maxBuildings] = cfg.buildingCount;
    const buildingCount = randInt(minBuildings, maxBuildings + 1);
    const margin = b + 100; // Keep away from border
    const minBuildingSize = 60;
    const maxBuildingSize = 200;
    const minGap = 80; // Minimum gap between buildings

    let attempts = 0;
    const maxAttempts = 500;

    while (this.walls.length < 4 + buildingCount && attempts < maxAttempts) {
      attempts++;

      const bw = randInt(minBuildingSize, maxBuildingSize + 1);
      const bh = randInt(minBuildingSize, maxBuildingSize + 1);
      const bx = rand(margin, this.width - margin - bw);
      const by = rand(margin, this.height - margin - bh);

      const newBuilding = { x: bx, y: by, w: bw, h: bh };

      // Check overlap with existing buildings (with gap)
      let overlaps = false;
      for (const wall of this.walls) {
        const gapWall = {
          x: wall.x - minGap,
          y: wall.y - minGap,
          w: wall.w + minGap * 2,
          h: wall.h + minGap * 2
        };
        if (rectIntersect(newBuilding, gapWall)) {
          overlaps = true;
          break;
        }
      }

      if (!overlaps) {
        this.walls.push(newBuilding);
      }
    }
  }

  draw(ctx, camera) {
    const cfg = this.themeConfig;
    const startCol = Math.floor(camera.x / this.tileSize);
    const endCol = Math.ceil((camera.x + camera.w) / this.tileSize);
    const startRow = Math.floor(camera.y / this.tileSize);
    const endRow = Math.ceil((camera.y + camera.h) / this.tileSize);

    // Draw ground tiles
    for (let row = startRow; row <= endRow; row++) {
      for (let col = startCol; col <= endCol; col++) {
        const x = col * this.tileSize;
        const y = row * this.tileSize;

        if (row >= 0 && row < this.ground.length && col >= 0 && col < this.ground[0].length) {
          const tile = this.ground[row][col];
          // Base ground color from theme
          ctx.fillStyle = cfg.groundColors[tile % cfg.groundColors.length];
          ctx.fillRect(x, y, this.tileSize, this.tileSize);
          // Grid line
          ctx.strokeStyle = cfg.gridColor;
          ctx.lineWidth = 0.5;
          ctx.strokeRect(x, y, this.tileSize, this.tileSize);
        } else {
          // 超出地图边界也画默认地面，避免黑色"虚空"
          ctx.fillStyle = cfg.outOfBounds;
          ctx.fillRect(x, y, this.tileSize, this.tileSize);
        }
      }
    }

    // Draw walls/buildings
    for (const wall of this.walls) {
      // Skip if not visible
      if (
        wall.x + wall.w < camera.x ||
        wall.x > camera.x + camera.w ||
        wall.y + wall.h < camera.y ||
        wall.y > camera.y + camera.h
      ) {
        continue;
      }

      const sx = wall.x;
      const sy = wall.y;

      // Building body
      ctx.fillStyle = cfg.wallBody;
      ctx.fillRect(sx, sy, wall.w, wall.h);

      // Building border
      ctx.strokeStyle = cfg.wallBorder;
      ctx.lineWidth = 2;
      ctx.strokeRect(sx, sy, wall.w, wall.h);

      // Roof detail
      ctx.fillStyle = cfg.wallRoof;
      ctx.fillRect(sx + 4, sy + 4, wall.w - 8, wall.h - 8);
    }
  }

  isWalkable(x, y, radius) {
    for (const wall of this.walls) {
      if (circleRectCollision(x, y, radius, wall.x, wall.y, wall.w, wall.h)) {
        return false;
      }
    }
    // Check map boundaries
    if (x - radius < 0 || x + radius > this.width ||
        y - radius < 0 || y + radius > this.height) {
      return false;
    }
    return true;
  }

  getSpawnPoints(count, playerX, playerY, minDist) {
    const points = [];
    const margin = this.borderWidth + 50;
    let attempts = 0;
    const maxAttempts = count * 50;

    while (points.length < count && attempts < maxAttempts) {
      attempts++;

      const x = rand(margin, this.width - margin);
      const y = rand(margin, this.height - margin);

      // Must be far from player
      if (dist(x, y, playerX, playerY) < minDist) {
        continue;
      }

      // Must not be inside a wall
      if (!this.isWalkable(x, y, 15)) {
        continue;
      }

      // Must not be too close to other spawn points
      let tooClose = false;
      for (const p of points) {
        if (dist(x, y, p.x, p.y) < 60) {
          tooClose = true;
          break;
        }
      }
      if (tooClose) continue;

      points.push({ x, y });
    }

    return points;
  }
}

// ------------------------------------------------------------------
// 伤害计算
// ------------------------------------------------------------------
function calculateDamage(baseDamage, player, isCrit) {
  let dmg = baseDamage * player.upgrades.damageMult;

  // 连击加成
  if (player.combo > 0) {
    const comboBonus = Math.min(player.combo, MAX_COMBO_CAP) * COMBO_DAMAGE_BONUS;
    dmg *= (1 + comboBonus);
  }

  // 暴击
  if (isCrit) {
    dmg *= player.upgrades.critDamage;
  }

  if (dmg > DAMAGE_SOFT_CAP) {
    const excess = dmg - DAMAGE_SOFT_CAP;
    dmg = DAMAGE_SOFT_CAP + Math.sqrt(excess * DAMAGE_SOFT_CAP) * 0.55;
  }

  return Math.max(1, Math.round(dmg));
}

function rollCrit(player) {
  return Math.random() < player.upgrades.critChance;
}

// particles.js
// ============================================================
// particles.js — 粒子系统：Particle + ParticleSystem + FloatingText + Decal + DecalSystem
// ============================================================

// ------------------------------------------------------------------
// Particle 类
// ------------------------------------------------------------------
class Particle {
  constructor(x, y, vx, vy, life, color, size) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.life = life;
    this.maxLife = life;
    this.color = color;
    this.size = size;
    this.gravity = 0;
    this.friction = 1.0;
  }

  update(dt) {
    this.vx *= this.friction;
    this.vy *= this.friction;
    this.vy += this.gravity * dt;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.life -= dt;
    return this.life > 0;
  }

  draw(ctx) {
    const alpha = Math.max(0, this.life / this.maxLife);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * alpha, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

// ------------------------------------------------------------------
// ParticleSystem 类
// ------------------------------------------------------------------
class ParticleSystem {
  constructor() {
    this.particles = [];
  }

  push(particle) {
    this.particles.push(particle);
  }

  spawnBlood(x, y, count) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 50 + Math.random() * 150;
      this.particles.push(new Particle(
        x, y,
        Math.cos(angle) * speed,
        Math.sin(angle) * speed,
        0.3 + Math.random() * 0.5,
        randPick(['#aa0000', '#cc0000', '#880000', '#ff0000']),
        2 + Math.random() * 3
      ));
    }
  }

  spawnExplosion(x, y, radius, count) {
    // 冲击波
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 100 + Math.random() * 300;
      const p = new Particle(
        x, y,
        Math.cos(angle) * speed,
        Math.sin(angle) * speed,
        0.3 + Math.random() * 0.4,
        randPick(['#ff4400', '#ff8800', '#ffaa00', '#ffcc00', '#ffffff']),
        3 + Math.random() * 5
      );
      p.friction = 0.9;
      this.particles.push(p);
    }
    // 烟雾
    for (let i = 0; i < count / 2; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 30 + Math.random() * 60;
      const p = new Particle(
        x, y,
        Math.cos(angle) * speed,
        Math.sin(angle) * speed - 30,
        0.5 + Math.random() * 0.5,
        randPick(['#555555', '#666666', '#444444']),
        4 + Math.random() * 6
      );
      p.friction = 0.95;
      this.particles.push(p);
    }
  }

  spawnMuzzleFlash(x, y, angle) {
    // 闪光核心
    for (let i = 0; i < 5; i++) {
      const spreadAngle = angle + (Math.random() - 0.5) * 0.5;
      const speed = 80 + Math.random() * 120;
      this.particles.push(new Particle(
        x, y,
        Math.cos(spreadAngle) * speed,
        Math.sin(spreadAngle) * speed,
        0.05 + Math.random() * 0.1,
        randPick(['#ffffaa', '#ffffff', '#ffdd44']),
        2 + Math.random() * 3
      ));
    }
  }

  spawnShell(x, y, angle) {
    const shellAngle = angle + (Math.random() - 0.5) * 0.8;
    const speed = 80 + Math.random() * 60;
    const p = new Particle(
      x, y,
      Math.cos(shellAngle) * speed,
      Math.sin(shellAngle) * speed,
      0.8 + Math.random() * 0.4,
      '#ddaa33',
      2
    );
    p.gravity = 300;
    p.friction = 0.98;
    this.particles.push(p);
  }

  spawnSpark(x, y, count) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 50 + Math.random() * 100;
      this.particles.push(new Particle(
        x, y,
        Math.cos(angle) * speed,
        Math.sin(angle) * speed,
        0.1 + Math.random() * 0.2,
        '#ffff00',
        1 + Math.random() * 2
      ));
    }
  }

  update(dt) {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const alive = this.particles[i].update(dt);
      if (!alive) {
        this.particles.splice(i, 1);
      }
    }
  }

  draw(ctx) {
    for (const p of this.particles) {
      p.draw(ctx);
    }
  }
}

// ------------------------------------------------------------------
// FloatingText 类
// ------------------------------------------------------------------
class FloatingText {
  constructor(x, y, text, color, size = 14) {
    this.x = x;
    this.y = y;
    this.text = text;
    this.color = color;
    this.size = size;
    this.life = 1.2;
    this.maxLife = 1.2;
    this.vy = -50;
    this.vx = (Math.random() - 0.5) * 30;
  }

  update(dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.life -= dt;
    return this.life > 0;
  }

  draw(ctx) {
    const alpha = Math.max(0, this.life / this.maxLife);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = this.color;
    ctx.font = `bold ${this.size}px monospace`;
    ctx.textAlign = 'center';
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 2;
    ctx.strokeText(this.text, this.x, this.y);
    ctx.fillText(this.text, this.x, this.y);
    ctx.globalAlpha = 1.0;
    ctx.textAlign = 'left';
  }
}

// ------------------------------------------------------------------
// DecalSystem — 地面残留（血迹、弹壳）
// ------------------------------------------------------------------
class Decal {
  constructor(x, y, type, options = {}) {
    this.x = x;
    this.y = y;
    this.type = type; // 'blood', 'shell'
    this.life = options.life || (type === 'blood' ? 30 : 15);
    this.maxLife = this.life;
    this.rotation = options.rotation || 0;
    this.size = options.size || (type === 'blood' ? 8 + Math.random() * 12 : 3 + Math.random() * 2);
    this.color = options.color || (type === 'blood'
      ? randPick(['#660000', '#770000', '#550000', '#440000', '#800000'])
      : '#ccaa33');
    this.shape = options.shape || (type === 'blood' ? Math.floor(Math.random() * 3) : 0);

    // 预计算不规则血渍的顶点，避免 draw 时抖动
    this.shapePoints = [];
    if (this.type === 'blood' && this.shape === 2) {
      const points = 6 + Math.floor(Math.random() * 4);
      for (let i = 0; i < points; i++) {
        const a = (i / points) * Math.PI * 2;
        const r = this.size * (0.6 + Math.random() * 0.4);
        this.shapePoints.push({
          x: Math.cos(a) * r,
          y: Math.sin(a) * r,
        });
      }
    }
  }

  update(dt) {
    this.life -= dt;
    return this.life > 0;
  }

  draw(ctx) {
    const alpha = Math.max(0, this.life / this.maxLife) * 0.7;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    ctx.fillStyle = this.color;

    if (this.type === 'blood') {
      if (this.shape === 0) {
        ctx.beginPath();
        ctx.arc(0, 0, this.size, 0, Math.PI * 2);
        ctx.fill();
      } else if (this.shape === 1) {
        ctx.beginPath();
        ctx.ellipse(0, 0, this.size, this.size * 0.6, 0, 0, Math.PI * 2);
        ctx.fill();
      } else if (this.shapePoints.length > 0) {
        // 不规则血渍 — 使用预计算顶点
        ctx.beginPath();
        for (let i = 0; i <= this.shapePoints.length; i++) {
          const p = this.shapePoints[i % this.shapePoints.length];
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
        ctx.closePath();
        ctx.fill();
      }
      // 血渍中心更深
      ctx.globalAlpha = alpha * 0.5;
      ctx.fillStyle = '#330000';
      ctx.beginPath();
      ctx.arc(0, 0, this.size * 0.4, 0, Math.PI * 2);
      ctx.fill();
    } else if (this.type === 'shell') {
      // 弹壳：细长椭圆
      ctx.beginPath();
      ctx.ellipse(0, 0, this.size * 1.5, this.size * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();
      // 弹壳高光
      ctx.fillStyle = '#eedd66';
      ctx.beginPath();
      ctx.ellipse(-1, -0.5, this.size * 0.8, this.size * 0.2, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }
}

class DecalSystem {
  constructor() {
    this.decals = [];
    this.maxDecals = 300; // 上限防止内存爆炸
  }

  addBlood(x, y, count = 1) {
    for (let i = 0; i < count; i++) {
      const offsetX = (Math.random() - 0.5) * 30;
      const offsetY = (Math.random() - 0.5) * 30;
      this.decals.push(new Decal(x + offsetX, y + offsetY, 'blood', {
        rotation: Math.random() * Math.PI * 2,
        life: 20 + Math.random() * 40,
      }));
    }
    this._trim();
  }

  addShell(x, y, angle) {
    const offsetX = (Math.random() - 0.5) * 8;
    const offsetY = (Math.random() - 0.5) * 8;
    this.decals.push(new Decal(x + offsetX, y + offsetY, 'shell', {
      rotation: angle + (Math.random() - 0.5) * 1.5,
      life: 10 + Math.random() * 10,
      size: 2 + Math.random() * 2,
    }));
    this._trim();
  }

  _trim() {
    if (this.decals.length > this.maxDecals) {
      // 移除最旧的（前10%）
      const removeCount = Math.floor(this.maxDecals * 0.1);
      this.decals.splice(0, removeCount);
    }
  }

  update(dt) {
    for (let i = this.decals.length - 1; i >= 0; i--) {
      if (!this.decals[i].update(dt)) {
        this.decals.splice(i, 1);
      }
    }
  }

  draw(ctx) {
    for (const d of this.decals) {
      d.draw(ctx);
    }
  }

  clear() {
    this.decals = [];
  }
}

const PICKUP_TYPES = {
  health:  { name: '生命包',  color: '#0f0', symbol: '+', effect: 'heal',     value: 30, duration: 0 },
  ammo:    { name: '弹药箱',  color: '#ff0', symbol: 'A', effect: 'ammo',     value: 0,  duration: 0 },
  speed:   { name: '加速',    color: '#0af', symbol: 'S', effect: 'speed',    value: 1.5, duration: 10 },

  shield:  { name: '护盾',    color: '#a0f', symbol: 'P', effect: 'shield',   value: 0,  duration: 5 },
};

class Pickup {
  constructor(x, y, type) {
    this.x = x;
    this.y = y;
    this.type = type;
    this.data = PICKUP_TYPES[type];
    this.life = 25;        // 25秒后消失
    this.maxLife = 25;
    this.radius = 12;
    this.floatTime = 0;
    this.pulseScale = 1;
  }

  update(dt) {
    this.life -= dt;
    this.floatTime += dt * 3;
    this.pulseScale = 1 + Math.sin(this.floatTime) * 0.15;
    return this.life > 0;
  }

  draw(ctx) {
    const pulse = this.pulseScale;
    const alpha = Math.min(1, this.life / 2);
    ctx.save();
    ctx.globalAlpha = alpha;

    // 外发光
    ctx.shadowColor = this.data.color;
    ctx.shadowBlur = 8;

    // 底色圆
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * pulse, 0, Math.PI * 2);
    ctx.fill();

    // 主色圆
    ctx.fillStyle = this.data.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * pulse * 0.7, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;

    // 符号
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${10 * pulse}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.data.symbol, this.x, this.y);

    ctx.restore();
  }
}

// 掉落概率配置
const DROP_RATES = {
  normal:   0.08,
  runner:   0.05,
  tank:     0.15,
  bomber:   0.10,
  spitter:  0.10,
  summoner: 0.20,
  elite:    0.20,
  spider:   0.10,
  miniSpider: 0.05,
  boss:     0.50,
};

function rollPickupDrop(enemyType, x, y) {
  const rate = DROP_RATES[enemyType] || 0;
  if (Math.random() >= rate) return null;

  // 根据敌人类型决定掉落类型权重
  let pool = ['health', 'ammo', 'speed', 'damage', 'shield'];
  if (enemyType === 'boss') {
    pool = ['health', 'health', 'ammo', 'damage', 'shield'];
  }
  const type = pool[Math.floor(Math.random() * pool.length)];
  return new Pickup(x, y, type);
}

// ============================================================
// vehicles.js — 载具系统
// ============================================================

class Vehicle {
  constructor(x, y, type = 'buggy') {
    const data = VEHICLE_DATA[type] || VEHICLE_DATA.buggy;
    this.type = data.id;
    this.data = data;
    this.x = x;
    this.y = y;
    this.angle = Math.random() * Math.PI * 2;
    this.turretAngle = this.angle;
    this.hp = data.maxHp;
    this.maxHp = data.maxHp;
    this.radius = data.radius;
    this.width = data.width;
    this.height = data.height;
    this.speedMult = data.speedMult;
    this.weaponBoost = data.weaponBoost;
    this.weaponFireRateMult = data.weaponFireRateMult;
    this.driver = null;
    this.enterCooldown = 0;
    this.color = data.color;
    this.cabinColor = data.cabinColor;
    this.wheelColor = '#222';
    this.alive = true;

    // 载具武器（机枪）
    this.mountedWeapon = {
      fireTimer: 0,
      fireRate: 12,       // 每秒12发
      damage: 15,
      spread: 0.15,
      piercing: 2,
      color: '#ffdd44',
    };
  }

  update(dt) {
    if (this.enterCooldown > 0) this.enterCooldown -= dt;

    // 载具武器冷却
    if (this.mountedWeapon.fireTimer > 0) {
      this.mountedWeapon.fireTimer -= dt;
    }

    if (this.driver) {
      this.turretAngle = angleTo(this.x, this.y, INPUT.mouseWorldX, INPUT.mouseWorldY);

      // 载具移动 — 保持WASD绝对方向控制，但速度更快
      let dx = 0, dy = 0;
      if (INPUT.keys['KeyW'] || INPUT.keys['ArrowUp']) dy -= 1;
      if (INPUT.keys['KeyS'] || INPUT.keys['ArrowDown']) dy += 1;
      if (INPUT.keys['KeyA'] || INPUT.keys['ArrowLeft']) dx -= 1;
      if (INPUT.keys['KeyD'] || INPUT.keys['ArrowRight']) dx += 1;

      if (dx !== 0 || dy !== 0) {
        const len = Math.sqrt(dx * dx + dy * dy);
        dx /= len; dy /= len;
        this.angle = Math.atan2(dy, dx);

        let speed = this.driver.speed * this.driver.upgrades.speedMult * this.speedMult;
        if (this.driver.buffs.speed.active) speed *= this.driver.buffs.speed.mult;

        const newX = this.x + dx * speed * dt;
        const newY = this.y + dy * speed * dt;

        if (game.map.isWalkable(newX, this.y, this.radius)) this.x = newX;
        if (game.map.isWalkable(this.x, newY, this.radius)) this.y = newY;

        // 同步玩家位置
        this.driver.x = this.x;
        this.driver.y = this.y;

        // 碾压敌人
        for (const enemy of game.enemies) {
          if (!enemy.alive) continue;
          const d = dist(this.x, this.y, enemy.x, enemy.y);
          if (d < this.radius + enemy.radius - 5) {
            const runoverDmg = enemy.type === 'tank' || enemy.type === 'boss' ? 30 : 80;
            enemy.takeDamage(runoverDmg, { isVehicle: true });
            this.hp -= enemy.type === 'tank' || enemy.type === 'boss' ? 15 : 5;
            // 击退
            const kbAngle = angleTo(this.x, this.y, enemy.x, enemy.y);
            enemy.x += Math.cos(kbAngle) * 40;
            enemy.y += Math.sin(kbAngle) * 40;
            // 血液
            game.particles.spawnBlood(enemy.x, enemy.y, 5);
          }
        }
      }

      // E键下车
      if (INPUT.keys['KeyE'] && this.enterCooldown <= 0) {
        this.exit();
        INPUT.keys['KeyE'] = false;
      }
    }
  }

  enter(player) {
    if (this.enterCooldown > 0) return false;
    if (this.driver) return false;
    this.driver = player;
    player.inVehicle = this;
    this.enterCooldown = 0.5;
    if (game.metaProgression) game.metaProgression.recordVehicle(this.type);
    return true;
  }

  exit() {
    if (!this.driver) return;
    // 找下车位置
    const offsets = [
      { x: Math.cos(this.angle + Math.PI / 2) * 45, y: Math.sin(this.angle + Math.PI / 2) * 45 },
      { x: -Math.cos(this.angle + Math.PI / 2) * 45, y: -Math.sin(this.angle + Math.PI / 2) * 45 },
      { x: Math.cos(this.angle) * 45, y: Math.sin(this.angle) * 45 },
      { x: -Math.cos(this.angle) * 45, y: -Math.sin(this.angle) * 45 },
    ];
    let exitPos = null;
    for (const off of offsets) {
      const ex = this.x + off.x;
      const ey = this.y + off.y;
      if (game.map.isWalkable(ex, ey, this.driver.radius)) {
        exitPos = { x: ex, y: ey };
        break;
      }
    }
    this.driver.x = exitPos ? exitPos.x : this.x;
    this.driver.y = exitPos ? exitPos.y : this.y;
    this.driver.inVehicle = null;
    this.driver = null;
    this.enterCooldown = 0.5;
  }

  takeDamage(amount) {
    this.hp -= amount;
    if (this.hp <= 0) {
      this.destroy();
    }
  }

  destroy() {
    this.alive = false;
    game.particles.spawnExplosion(this.x, this.y, 50, 25);
    if (this.driver) {
      this.driver.x = this.x;
      this.driver.y = this.y;
      this.driver.inVehicle = null;
      this.driver.invincibleTimer = 1.5;
      this.driver = null;
    }
    game.floatingTexts.push(new FloatingText(
      this.x, this.y - 30,
      '载具损毁!', '#f44', 20
    ));
  }

  _fireMountedWeapon() {
    const mw = this.mountedWeapon;
    if (mw.fireTimer > 0) return;

    const driverWeapon = this.driver && this.driver.getCurrentWeapon ? this.driver.getCurrentWeapon() : null;
    const currentStats = driverWeapon ? driverWeapon.getEffectiveStats() : null;
    const baseData = driverWeapon ? driverWeapon.getEffectiveWeaponData(currentStats) : {
      id: 'mounted',
      name: '载具机枪',
      damage: mw.damage,
      fireRate: mw.fireRate,
      magazine: Infinity,
      reloadTime: 0,
      projectileSpeed: 500,
      piercing: mw.piercing,
      spread: mw.spread,
      projectileCount: 1,
      continuous: false,
      melee: false,
      explosive: 0,
      chain: false,
    };

    const boostedFireRate = (currentStats ? currentStats.fireRate : mw.fireRate) * this.weaponFireRateMult;
    mw.fireTimer = 1 / boostedFireRate;

    this.turretAngle = angleTo(this.x, this.y, INPUT.mouseWorldX, INPUT.mouseWorldY);
    const projectileCount = Math.max(1, baseData.projectileCount || 1);
    const spread = baseData.spread || mw.spread || 0;
    const boostedDamage = Math.round((currentStats ? currentStats.damage : mw.damage) * this.weaponBoost);
    const projectileData = {
      ...baseData,
      damage: boostedDamage,
      fireRate: boostedFireRate,
      projectileSpeed: baseData.projectileSpeed === Infinity ? Infinity : baseData.projectileSpeed * 1.15,
      piercing: (baseData.piercing || 0) + 1,
      vehicleBoosted: true,
      sourceWeaponId: driverWeapon ? driverWeapon.data.id : 'mounted',
    };
    const isCrit = this.driver ? rollCrit(this.driver) : false;
    const damage = this.driver ? calculateDamage(boostedDamage, this.driver, isCrit) : boostedDamage;
    const originX = this.x + Math.cos(this.turretAngle) * (this.width / 2 + 8);
    const originY = this.y + Math.sin(this.turretAngle) * (this.height / 2 + 8);

    for (let i = 0; i < projectileCount; i++) {
      let angle = this.turretAngle;
      if (spread > 0) {
        if (projectileCount === 1) {
          angle += (Math.random() - 0.5) * 2 * spread;
        } else {
          const step = (2 * spread) / Math.max(1, projectileCount - 1);
          angle = this.turretAngle - spread + step * i;
        }
      }
      const muzzleX = originX + Math.cos(angle) * 2;
      const muzzleY = originY + Math.sin(angle) * 2;

      const proj = new Projectile(
        muzzleX,
        muzzleY,
        angle,
        projectileData,
        this.driver,
        {
          damage,
          isCrit,
          continuous: projectileData.continuous && !projectileData.melee,
          melee: projectileData.melee,
          life: projectileData.continuous ? 0.05 : (projectileData.melee ? 0.1 : 3.0),
        }
      );
      game.projectiles.push(proj);

      game.particles.spawnMuzzleFlash(muzzleX, muzzleY, angle);
      if (!projectileData.continuous && !projectileData.melee) {
        game.particles.spawnShell(muzzleX, muzzleY, angle + Math.PI / 2);
      }
    }
  }

  draw(ctx) {
    if (!this.alive) return;

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);

    // 车身阴影
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(-this.width / 2 + 2, -this.height / 2 + 2, this.width, this.height);

    // 车身
    ctx.fillStyle = this.color;
    ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);

    // 车顶/细节
    ctx.fillStyle = this.cabinColor;
    ctx.fillRect(-8, -this.height / 2 + 4, 20, this.height - 8);

    // 挡风玻璃
    ctx.fillStyle = '#88ccff';
    ctx.fillRect(6, -this.height / 2 + 3, 10, this.height - 6);

    // 车灯
    ctx.fillStyle = '#ffdd44';
    ctx.fillRect(this.width / 2 - 2, -this.height / 2 + 2, 3, 5);
    ctx.fillRect(this.width / 2 - 2, this.height / 2 - 7, 3, 5);

    // 车轮
    ctx.fillStyle = this.wheelColor;
    ctx.fillRect(-16, -this.height / 2 - 3, 10, 4);
    ctx.fillRect(8, -this.height / 2 - 3, 10, 4);
    ctx.fillRect(-16, this.height / 2 - 1, 10, 4);
    ctx.fillRect(8, this.height / 2 - 1, 10, 4);

    ctx.restore();

    // 独立旋转的车载机枪炮塔
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.turretAngle);
    ctx.fillStyle = '#263238';
    ctx.fillRect(-4, -5, 13, 10);
    ctx.fillStyle = '#111';
    ctx.fillRect(4, -3, 24, 6);
    ctx.fillStyle = '#ffdd44';
    ctx.fillRect(25, -2, 4, 4);
    ctx.restore();

    // 载具血条
    if (this.hp < this.maxHp) {
      const barW = 44, barH = 4;
      ctx.fillStyle = '#333';
      ctx.fillRect(this.x - barW / 2, this.y - this.radius - 10, barW, barH);
      ctx.fillStyle = this.hp > this.maxHp * 0.3 ? '#4a6' : '#a44';
      ctx.fillRect(this.x - barW / 2, this.y - this.radius - 10, barW * (this.hp / this.maxHp), barH);
    }

    // 驾驶提示
    if (!this.driver) {
      const d = dist(game.player.x, game.player.y, this.x, this.y);
      if (d < this.radius + game.player.radius + 25) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('[E] 驾驶', this.x, this.y - this.radius - 16);
      }
    }
  }
}

class VehicleManager {
  constructor() {
    this.vehicles = [];
  }

  spawn(count) {
    this.vehicles = this.vehicles.filter(v => v.alive && v.driver);
    while (this.vehicles.length < count) {
      const pos = this._findSpawnPosition();
      if (!pos) break;
      this.vehicles.push(new Vehicle(pos.x, pos.y, this._pickVehicleType()));
    }
  }

  _pickVehicleType() {
    const ids = Object.keys(VEHICLE_DATA);
    return ids[Math.floor(Math.random() * ids.length)];
  }

  _findSpawnPosition() {
    for (let attempt = 0; attempt < 80; attempt++) {
      const x = 80 + Math.random() * (game.map.width - 160);
      const y = 80 + Math.random() * (game.map.height - 160);
      if (game.map.isWalkable(x, y, 25)) {
        // 确保离玩家不太近
        const d = dist(x, y, game.player.x, game.player.y);
        if (d > 200) {
          return { x, y };
        }
      }
    }
    return null;
  }

  update(dt) {
    for (const v of this.vehicles) {
      v.update(dt);
    }
    this.vehicles = this.vehicles.filter(v => v.alive);
  }

  draw(ctx) {
    for (const v of this.vehicles) {
      v.draw(ctx);
    }
  }

  checkPlayerInteraction(player) {
    if (player.inVehicle) return;
    for (const v of this.vehicles) {
      if (!v.alive || v.driver) continue;
      const d = dist(player.x, player.y, v.x, v.y);
      if (d < v.radius + player.radius + 15 && INPUT.keys['KeyE']) {
        if (v.enter(player)) {
          INPUT.keys['KeyE'] = false;
          game.floatingTexts.push(new FloatingText(
            player.x, player.y - 40,
            '进入载具!', '#4a6', 18
          ));
        }
      }
    }
  }
}
